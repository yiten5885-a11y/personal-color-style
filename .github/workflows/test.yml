name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CJK test font
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
      - name: Install test dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Check publishable package
        run: python scripts/check_package.py
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
